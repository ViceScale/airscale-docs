name: MCP catalog parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - contracts/mcp-tools.json
      - api-reference/leads-finder.mdx
      - scripts/check-mcp-parity.mjs
      - tests/mcp-guidance.test.mjs
      - tests/mcp-parity.test.mjs
      - .github/workflows/mcp-contract-parity.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/mcp-parity.test.mjs tests/mcp-guidance.test.mjs
      - run: npm run mcp:check-live
